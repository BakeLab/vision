name: tests

on:
  pull_request:
    paths:
      - "test/test_datasets_download.py"
      - ".github/failed_schedule_issue_template.md"
      - ".github/workflows/tests-schedule.yml"

  schedule:
    - cron: "0 9 * * *"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: system-python
        name: Check for runner Python 3.14+
        run: |
          if python3 -c 'import sys; raise SystemExit(sys.version_info < (3, 14))'; then
            echo "available=true" >>"$GITHUB_OUTPUT"
            python3 --version
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.14
        if: ${{ steps.system-python.outputs.available != 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify Python 3.14+
        run: python3 -c 'import sys; assert sys.version_info >= (3, 14), f"Python 3.14+ required, got {sys.version.split()[0]}"'

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Upgrade system packages
        run: uv pip install --system --upgrade pip setuptools wheel

      - name: SSL
        run: python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)'

      - name: TODO REMOVE THIS! Install non pre-release version of mpmath.
        run: uv pip install --system "mpmath<1.4"

      - name: Install torch nightly build
        run: uv pip install --system --prerelease allow torch --find-links https://download.pytorch.org/whl/nightly/cpu/torch_nightly.html

      - name: Install torchvision
        run: uv pip install --system --no-build-isolation --editable .

      - name: Install all optional dataset requirements
        run: uv pip install --system scipy pycocotools lmdb gdown

      - name: Install tests requirements
        run: uv pip install --system pytest

      - name: Run tests
        run: python3 -m pytest -ra -v test/test_datasets_download.py

      - uses: JasonEtco/create-an-issue@v2.4.0
        name: Create issue if download tests failed
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          ID: ${{ github.run_id }}
        with:
          filename: .github/failed_schedule_issue_template.md
